[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clawlab-audit"
version = "0.3.0"
description = "Lightweight execution auditing for Python agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cryptography>=41.0"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ClawLab"}]

[tool.setuptools]
packages = ["clawlab"]
